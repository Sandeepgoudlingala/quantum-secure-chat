version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pqc_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: pqc_capstone_db
      MYSQL_USER: pqc_user
      MYSQL_PASSWORD: pqc_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pqc_user", "-ppqc_secure_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pqc_backend_api
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://pqc_user:pqc_secure_password@db:3306/pqc_capstone_db
      - SECRET_KEY=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      - ML_KEM_PARAMETER_SET=ML-KEM-768
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pqc_frontend_app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
